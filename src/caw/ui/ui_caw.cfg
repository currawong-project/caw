{
  base_dir:    "~/src/caw/src/caw/ui/io",
  io_dict:     "~/src/caw/src/caw/cfg/io.cfg"            // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.
  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files 
  log: { flags:[ date_time, no_file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
    
  programs: {

    ex_01_meter: {

      network: {
      
        procs: {
	  af: { class:audio_file_in, args:{ fname:"$/60_samples.wav", eofFl:false, on_off:true }},	  
	  aout:{ class:audio_out, in:{ in:af.out }, args:{ dev_label:"main"} }
	  mtr: { class:audio_meter, in:{ in:af.out } args:{ rpt_ms: 50 } }
	  
        }
      }
    }


   mod_sine: {

      //dur_limit_secs:30.0,  // Run the network for 5 seconds
      //non_real_time_fl: false,
      
      network: {

        procs: {
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110 },            ui:{ create_fl:true }}
          frame: { class: ui_container,                                          ui:{ create_fl:true, title:"My Frame" } },
          sh:    { class: sample_hold,            in:{ in:lfo.out },             ui:{ create_fl:true, parent_name:frame} }
          osc:   { class: sine_tone, in:{ hz:sh.out }                            ui:{ create_fl:true, parent_name:frame } },
          aout:  { class:audio_out, in:{ in:osc.out }, args:{ dev_label:"main"}, ui:{create_fl:true } }
          //af:  { class: audio_file_out, in: { in:osc.out } args:{  fname:"$/out.wav"} }
        }
      }
    }

   mod_sine_mono: {

      //dur_limit_secs:30.0,  // Run the network for 5 seconds
      //non_real_time_fl: false,
      
      network: {

        procs: {
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110, ch_cnt:1 },  ui:{ create_fl:true }}
          frame: { class: ui_container,                                          ui:{ create_fl:true, title:"My Frame" } },
          sh:    { class: sample_hold,            in:{ in:lfo.out },             ui:{ create_fl:true, parent_name:frame} }
          osc:   { class: sine_tone, in:{ hz:sh.out }, args:{ ch_cnt:1}         ui:{ create_fl:true, parent_name:frame } },
          aout:  { class:audio_out, in:{ in:osc.out }, args:{ dev_label:"main"}, ui:{create_fl:true } }
          //af:  { class: audio_file_out, in: { in:osc.out } args:{  fname:"$/out.wav"} }
        }
      }
    }

   ex_02_mod_sine: {

      network: {

        procs: {
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110 },               ui:{create_fl:true} }
          sh:    { class: sample_hold, in:{ in:lfo.out },                           ui:{create_fl:true} }
          osc:   { class: sine_tone,   in:{ hz:sh.out },                            ui:{create_fl:true} },
	  aout:  { class:audio_out,    in:{ in:osc.out }, args:{ dev_label:"main"}, ui:{create_fl:true} }
        }
      }
    }

   // Demonstrate a network with a polyphonic subnet.
   ex_03_homog_poly: {
   
     network: {

        procs: {

          g_list:  { class: list, args: { in:0, list:[ 110f,220f,440f ]}},
	  dc_list: { class: list, args: { in:0, list:[ 220f,440f,880f ]}},
	  
          osc_poly: {
	    class: poly,
	    
	    // Create 3 instances of 'network' and run them in concurrently.
	    args: { count:3, parallel_fl:true },  
	   
	    network: {
	      procs: {
	        lfo:  { class: sine_tone,   in:{ _.dc:_.dc_list.value_, _.gain:_.g_list.value_ }  args: { ch_cnt:1, hz:3 }},
	        sh:   { class: sample_hold, in:{ in:lfo.out }},
	        osc:  { class: sine_tone,   in:{ hz: sh.out }},
	      }
	    }       	    
	  }

          // Iterate over the instances of `osc_poly.osc_.out` to create one `audio_merge`
	  // input for every output from the polyphonic network.
	  merge: { class: audio_merge,    in:{ in_:osc_poly.osc_.out}, args:{ gain:1, out_gain:0.5 }},
	  aout:  { class:audio_out, in:{ in:merge.out }, args:{ dev_label:"main"} }
        }
      }
    }

   // ------------------------------------------------------------------------------------
   // UI parent container tests. See libcw/docs/reload_design.md.
   // Select the program and press 'Load'. The programs have no audio output.
   // ------------------------------------------------------------------------------------

   // Same as ex_02_mod_sine with the audio output removed: no containers or 'parent_name'.
   ui_parent_00_mod_sine: {
      network: {
        procs: {
          lfo: { class: sine_tone,   args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true } }
          sh:  { class: sample_hold, in:{ in:lfo.out },               ui:{ create_fl:true } }
          osc: { class: sine_tone,   in:{ hz:sh.out },                ui:{ create_fl:true } }
        }
      }
    }

   // A root container holding two children of the root network.
   ui_parent_01_root: {
      network: {
        procs: {
          frame: { class: ui_container,                                  ui:{ create_fl:true, title:"frame" } }
          lfo:   { class: sine_tone,   args:{ hz:3, dc:440, gain:110 },  ui:{ create_fl:true, title:"lfo", parent_name:frame } }
          sh:    { class: sample_hold, in:{ in:lfo.out },                ui:{ create_fl:true, title:"sh",  parent_name:frame } }
          osc:   { class: sine_tone,   in:{ hz:sh.out },                 ui:{ create_fl:true, title:"osc" } }
        }
      }
    }

   // Expected error: the UI parent is declared after the child.
   ui_parent_02_err_late: {
      network: {
        procs: {
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true, parent_name:frame } }
          frame: { class: ui_container,                               ui:{ create_fl:true } }
        }
      }
    }

   // Expected error: the UI parent is not a container.
   ui_parent_03_err_not_container: {
      network: {
        procs: {
          lfo: { class: sine_tone,   args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true } }
          sh:  { class: sample_hold, in:{ in:lfo.out },               ui:{ create_fl:true, parent_name:lfo } }
        }
      }
    }

   // Expected error: the UI parent does not exist.
   ui_parent_04_err_not_found: {
      network: {
        procs: {
          lfo: { class: sine_tone, args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true, parent_name:no_such_proc } }
        }
      }
    }

   // A container inside a poly network: one frame per poly copy, holding that copy's children.
   ui_parent_05_poly: {
      network: {
        procs: {
          poly_a: {
            class: poly,
            args: { count:3 },
            ui:{ create_fl:true, title:"poly_a" },
            network: {
              procs: {
                frame: { class: ui_container,                                ui:{ create_fl:true, title:"frame" } }
                lfo:   { class: sine_tone,   args:{ ch_cnt:1, hz:3 },        ui:{ create_fl:true, title:"lfo", parent_name:frame } }
                sh:    { class: sample_hold, in:{ in:lfo.out },              ui:{ create_fl:true, title:"sh",  parent_name:frame } }
              }
            }
          }
        }
      }
    }

   ui_parent_05_poly_a: {

      network: {
        
        procs: {
          poly_a: {
            class: poly,
            args: { count:3 },
            ui:{ create_fl:true, title:"poly_a" },
            network: {
              procs: {
                lfo:   { class: sine_tone,   args:{ ch_cnt:1, hz:3 },        ui:{ create_fl:true, title:"lfo" } }
                sh:    { class: sample_hold, in:{ in:lfo.out },              ui:{ create_fl:true, title:"sh" } }
              }
            }
          }
        }
      }
    }


   // A child in an internal network uses a root container. The child's index in its own
   // network (1) is also the index of the root proc 'lfo', whose panel must be left alone.
   ui_parent_06_net_to_root: {
      network: {
        procs: {
          frame:  { class: ui_container,                               ui:{ create_fl:true, title:"frame" } }
          lfo:    { class: sine_tone, args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true, title:"lfo" } }
          poly_a: {
            class: poly,
            args: { count:2 },
            ui:{ create_fl:true, title:"poly_a" },
            network: {
              procs: {
                in_osc: { class: sine_tone,   args:{ ch_cnt:1, hz:3 }, ui:{ create_fl:true, title:"in_osc" } }
                in_sh:  { class: sample_hold, in:{ in:in_osc.out },    ui:{ create_fl:true, title:"in_sh", parent_name:frame } }
              }
            }
          }
        }
      }
    }

   // A child in an internal network uses a container in its own network. The root network
   // also has a 'frame', which must not be used because the nearest match wins.
   ui_parent_07_net_local: {
      network: {
        procs: {
          frame:  { class: ui_container,                               ui:{ create_fl:true, title:"root_frame" } }
          lfo:    { class: sine_tone, args:{ hz:3, dc:440, gain:110 }, ui:{ create_fl:true, title:"lfo", parent_name:frame } }
          poly_a: {
            class: poly,
            args: { count:1 },
            ui:{ create_fl:true, title:"poly_a" },
            network: {
              procs: {
                frame:  { class: ui_container,                 ui:{ create_fl:true, title:"net_frame" } }
                in_osc: { class: sine_tone,   args:{ ch_cnt:1, hz:3 }, ui:{ create_fl:true, title:"in_osc", parent_name:frame } }
              }
            }
          }
        }
      }
    }

   // An explicit 'parent_sfx_id' selects that instance of the container from every poly copy.
   ui_parent_08_explicit_sfx: {
      network: {
        procs: {
          frame0: { class: ui_container, ui:{ create_fl:true, title:"frame_0" } }
          frame1: { class: ui_container, ui:{ create_fl:true, title:"frame_1" } }
          poly_a: {
            class: poly,
            args: { count:2 },
            ui:{ create_fl:true, title:"poly_a" },
            network: {
              procs: {
                in_osc: { class: sine_tone, args:{ ch_cnt:1, hz:3 }, ui:{ create_fl:true, title:"in_osc", parent_name:frame, parent_sfx_id:1 } }
              }
            }
          }
        }
      }
    }

   // ------------------------------------------------------------------------------------
   // UI reload test. See libcw/docs/reload_design.md. Load the program, select the 'high'
   // preset, set the Run check, and then reload the browser or open a second client.
   // The program has no audio output.
   // ------------------------------------------------------------------------------------
   ui_reload_00: {
      network: {
        procs: {
          frame: { class: ui_container, ui:{ create_fl:true, title:"frame", add_class:reload_frame } }
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110 },
                   ui:{ create_fl:true, title:"lfo", add_class:reload_proc, parent_name:frame,
                        vars:{ hz:{ title:"Freq", add_class:reload_var } } } }
          sh:    { class: sample_hold, in:{ in:lfo.out }, ui:{ create_fl:true, vars:{ period_ms:{ flags:[hide] } } } }
          m_in:  { class: midi_in }
          mi:    { class: midi_indicator, in:{ r_in:m_in.r_out }, ui:{ create_fl:true, vars:{ reset:{ flags:[disable] } } } }
        }

        presets: {
          low:  { lfo: { hz:1 } }
          high: { lfo: { hz:9 } }
        }
      }
    }

   // An explicit 'parent_sfx_id' selects that instance of the container from every poly copy.
   ui_hide_00: {
      network: {
        procs: {
            numb0: { class: number, args:{ in:1.0, out_type:double }, ui:{ create_fl:true } }
          }
        }
      },
    


    mult_player_fx: {

      //dur_limit_secs: 10,   // Stop after this many seconds of processed audio.
      //non_real_time_fl: true,

      network: {
        procs: {
          do_start: { class: on_start },
          player : { class: multi_player,
                     //in:{ start:do_start.out },
                     args:{ cfg_fname:"/home/kevin/src/currawong/projects/gutim/gutim_1/caw/multi_player.json",
                            start_seg_id:10,
                            play_excl_id:-1 },
                            
                     ui: { create_fl:true } },

          prt: { class: print, in: { in0:player.start_ack_id, in1:player.stop_ack_id }, args:{ text:["start:","stop:"," "] }},
          
          samp_vt:{ class: vel_table,  in:{ in:player.out }, args:{ vel_tbl_fname:"/home/kevin/src/cw_proj/dev/io/vel_table_perf.json", vel_tbl_label:"ivory" }},

         

          vctl: { class: poly_voice_ctl, in:{ in:samp_vt.out }, args:{ voice_cnt:70, prune_thresh:35  } },

          ps:     { class: gutim_ps, preset:init,      in:{ in:player.out, midi_in_:vctl.out_, reset:player.start   },
                                                       preset: "init",
                                                       args:{ fname:"/home/kevin/src/currawong/projects/gutim/gutim_1/caw/presets.json",
                                                              loc_cnt:10000,
                                                              interp_fl:true,
                                                            },
                                                       ui:  { create_fl:true } }

                                                 
          xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true, vars:{ out_type:{ sfx_id:0, title:"type", flags:[show]}} } },
          
          voice_poly: {
            class: poly,
            args: { count:70 , parallel_fl:true, thread_cnt:5 }

            network: {
              procs: {
                voc: { class:piano_voice, in:{ _.in:_.vctl.out_ , _.reset:_.vctl.reset },
                                          out:{ _.done_fl:_.vctl.done_fl_ },
                                          args:{ wtb_fname:"~/media/audio/syn_wt/syn_wt_0.json",
                                          wtb_instr:"piano",
                                          rls_coeff: 0.99,
                                          rls_thresh:0.01 } },

                g:     { class: audio_gain,       in:{ in:voc.out, gain:_.xform_igain.out }  },
                pva:   { class: pv_analysis,      in:{ in:g.out, enable:voc.gate_fl, _.wndSmpN:_.ps.wnd_smp_cnt_ },  args:{ wndSmpN:512, hopSmpN:128, hzFl:false  } },
                sd:    { class: spec_dist,        in:{ in:pva.out,
                                                       enable:voc.gate_fl,
                                                       _.ceiling:_.ps.ceiling_,
                                                       _.expo:_.ps.expo_,
                                                       _.thresh:_.ps.thresh_,
                                                       _.upr:_.ps.upr_,
                                                       _.lwr:_.ps.lwr_,
                                                       _.mix:_.ps.mix_ },  preset:kc, args:{ bypass:false }   },
                
                pvs:   { class: pv_synthesis,     in:{ in:sd.out, enable:voc.gate_fl  } },
                cmp:   { class: compressor,       in:{ in:pvs.out,
                                                       enable:voc.gate_fl,
                                                       _.igain:_.ps.c_igain_,
                                                       _.ogain:_.ps.c_ogain_ }, preset:kc, args:{ bypass:false }   },
                                                       
                ogain: { class: audio_gain,       in:{ in:cmp.out, _.gain:_.ps.dry_gain_ } },


              }
            }
          }

          amix: { class: audio_mix,   in:{ in_:voice_poly.voc_.out }     args:{ igain_:1.0 }},

          amtr: { class: audio_meter, in:{ in:amix.out },                ui: { create_fl:true } }
          //aout: { class: audio_out,   in:{ in:amix.out },                args:{ dev_label:"main"}, ui:{ create_fl:true } }
          af:   { class: audio_file_out, in:{ in:amix.out },             args:{  fname:"out_1.wav"} }


        }
      }
    } // multi_player_fx

    // Single channel 'any' channel inputs connected to channelized sources.
    // 'sh.out' is channelized, 'pr.in' is not. 'pr.in' must be connected to 'sh.out' ch:0
    // otherwise only the initial value is printed.  Run with 'caw exec'.
    ch_conn_in_1ch: {
      non_real_time_fl:true, dur_limit_secs:0.5,
      network: { procs: {
        lfo: { class: sine_tone,   args:{ ch_cnt:1, hz:3, dc:440, gain:110 }}
        sh:  { class: sample_hold, in:{ in:lfo.out } }
        pr:  { class: print,       in:{ in:sh.out }, args:{ text:["sh:"] } }
      }}
    }

    // Same as ch_conn_in_1ch but using a feedback (out-stmt) connection.
    ch_conn_out_1ch: {
      non_real_time_fl:true, dur_limit_secs:0.5,
      network: { procs: {
        pr:  { class: print,       args:{ in:0.0, text:["sh:"] } }
        lfo: { class: sine_tone,   args:{ ch_cnt:1, hz:3, dc:440, gain:110 }}
        sh:  { class: sample_hold, in:{ in:lfo.out }, out:{ out:pr.in } }
      }}
    }

    // EXPECTED TO FAIL: 'sh.out' has 2 channels but 'pr.in' has only one.
    ch_conn_in_2ch_fail: {
      non_real_time_fl:true, dur_limit_secs:0.5,
      network: { procs: {
        lfo: { class: sine_tone,   args:{ ch_cnt:2, hz:3, dc:440, gain:110 }}
        sh:  { class: sample_hold, in:{ in:lfo.out } }
        pr:  { class: print,       in:{ in:sh.out }, args:{ text:["sh:"] } }
      }}
    }

    // EXPECTED TO FAIL: as ch_conn_in_2ch_fail but using a feedback (out-stmt) connection.
    ch_conn_out_2ch_fail: {
      non_real_time_fl:true, dur_limit_secs:0.5,
      network: { procs: {
        pr:  { class: print,       args:{ in:0.0, text:["sh:"] } }
        lfo: { class: sine_tone,   args:{ ch_cnt:2, hz:3, dc:440, gain:110 }}
        sh:  { class: sample_hold, in:{ in:lfo.out }, out:{ out:pr.in } }
      }}
    }




  }
}
